<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片 → 完整三维人体</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a111b;color:#e9f0fa;font:15px system-ui}header{padding:25px 5vw;border-bottom:1px solid #263348}h1{font-size:26px;margin:5px 0}p{color:#a9b8cb;line-height:1.7}main{max-width:1400px;margin:auto;padding:25px;display:grid;grid-template-columns:320px 1fr;gap:22px}.card{background:#111d2d;border:1px solid #29394e;border-radius:16px;padding:22px}button,.link{background:#53c8b5;color:#092521;border:0;border-radius:8px;padding:12px 17px;cursor:pointer;font-weight:650;display:inline-block;text-decoration:none}button:disabled{opacity:.45;cursor:wait}.secondary{background:#25384d;color:white}input{width:100%;margin:15px 0}#photo{max-width:100%;max-height:240px;display:none;margin:auto}#stage{position:relative;min-height:570px;padding:0;overflow:hidden}canvas{display:block;width:100%;height:570px;touch-action:none}#hint{position:absolute;top:18px;left:20px;color:#afc2d9;pointer-events:none}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}#log{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;color:#8ba0bb}#status{line-height:1.7;color:#77d9c9}#meta{color:#9db0c9;font-size:13px}.note{font-size:13px}#downloads{display:none}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}#stage{min-height:440px}canvas{height:440px}}</style>
<header><small style="color:#64cfbe">创新实践 · SINGLE IMAGE TO 3D</small><h1>上传照片，生成完整三维模型</h1><p style="margin-bottom:0">真实 TripoSR 推理 · 彩色三角网格 · 360° 旋转 · GLB 导出</p></header>
<main><section class="card"><b>1 / 上传清晰全身照</b><p class="note">正面、单人、头脚完整，双臂与身体留有间隙。透明背景 PNG 效果更稳定，普通照片会自动去背景。</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><img id="photo" alt="待生成照片"><div class="tools"><button id="generate" disabled>生成完整 3D 模型</button><button id="sample" class="secondary">使用人体样例</button></div><p id="status">选择照片后开始生成。</p><p class="note">单张照片看不到的背面由 AI 推测，可能与真人不同。此通用模型的人脸、手和衣服细节仍有限；结果不是精确人体扫描，也不是三篇课程论文的完整复现。</p><details><summary>运行日志</summary><pre id="log"></pre></details></section>
<section><div id="stage" class="card"><canvas id="viewer"></canvas><span id="hint">2 / 完整网格预览 · 拖动旋转，滚轮缩放</span></div><div class="tools"><button class="secondary" data-angle="0">正面</button><button class="secondary" data-angle="90">侧面</button><button class="secondary" data-angle="180">背面</button><button id="spin" class="secondary">自动旋转</button><button id="wire" class="secondary">切换几何 / 彩色</button></div><p id="meta">尚未生成模型</p><div id="downloads" class="tools"><a id="glb" class="link" download>下载 GLB 模型</a><a id="ply" class="link secondary" download>下载彩色 PLY</a><a id="fg" class="link secondary" target="_blank">查看去背景结果</a></div></section></main>
<script>
const $=s=>document.querySelector(s),cv=$('#viewer'),gl=cv.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});let count=0,yaw=0,pitch=0,zoom=1,auto=false,plain=false,selected=null,loaded='';
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
if(!gl)$('#status').textContent='浏览器不支持 WebGL，请换用 Chrome 或 Edge。';
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,`attribute vec3 p,n,c;uniform float yaw,pitch,aspect,zoom;varying vec3 color,normal;vec3 turn(vec3 v){float a=cos(yaw),b=sin(yaw);vec3 q=vec3(a*v.x-b*v.y,b*v.x+a*v.y,v.z);float d=cos(pitch),e=sin(pitch);return vec3(q.x,d*q.y-e*q.z,e*q.y+d*q.z);}void main(){vec3 q=turn(p);normal=turn(n);color=c;float scale=0.83*zoom;gl_Position=vec4(q.y*scale/aspect,q.z*scale,-q.x*0.25,1.0);}`));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 color,normal;uniform float plain;void main(){vec3 n=normalize(normal);float light=0.65+0.35*abs(dot(n,normalize(vec3(-1.,-.5,1.))));gl_FragColor=vec4(mix(color,vec3(.68,.77,.83),plain)*light,1.);}`));gl.linkProgram(prog);gl.useProgram(prog);gl.enable(gl.DEPTH_TEST);gl.clearColor(.055,.085,.13,1);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);for(const [i,name]of ['p','n','c'].entries()){const a=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,i*12)}
const uni={};for(const k of ['yaw','pitch','aspect','zoom','plain'])uni[k]=gl.getUniformLocation(prog,k);
function draw(){const d=Math.min(devicePixelRatio,2),w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(auto)yaw+=.006;gl.uniform1f(uni.yaw,yaw);gl.uniform1f(uni.pitch,pitch);gl.uniform1f(uni.aspect,w/h);gl.uniform1f(uni.zoom,zoom);gl.uniform1f(uni.plain,plain?1:0);gl.drawArrays(gl.TRIANGLES,0,count);requestAnimationFrame(draw)}draw();
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.012;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY]}};cv.onpointerup=cv.onpointercancel=()=>drag=null;cv.onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)))};
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{yaw=Number(b.dataset.angle)*Math.PI/180;pitch=0;auto=false});$('#spin').onclick=()=>auto=!auto;$('#wire').onclick=()=>plain=!plain;
async function loadModel(path){const [r,m]=await Promise.all([fetch(path+'/triangles.bin'),fetch(path+'/mesh.json').then(r=>r.json())]);if(!r.ok)throw Error('模型文件读取失败');const a=new Float32Array(await r.arrayBuffer());gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);count=a.length/9;yaw=0;pitch=0;zoom=1;loaded=path;$('#meta').textContent=`${m.vertices.toLocaleString()} 个顶点 · ${m.faces.toLocaleString()} 个三角面 · ${m.seconds} 秒 · 显存 ${m.gpu_peak_gb} GB · ${m.watertight?'闭合网格':'网格可能有孔洞'}`;$('#downloads').style.display='flex';for(const [id,file]of [['glb','human.glb'],['ply','human.ply'],['fg','foreground.png']])$('#'+id).href=path+'/'+file;$('#hint').textContent='真实生成的三维网格 · 拖动可查看背面'}
function select(blob){selected=blob;$('#photo').style.display='block';$('#photo').src=URL.createObjectURL(blob);$('#generate').disabled=false;$('#status').textContent='照片已选择，可以开始生成。'}$('#file').onchange=e=>{if(e.target.files[0])select(e.target.files[0])};$('#sample').onclick=async()=>{try{select(await fetch('sample_person.png').then(r=>r.blob()))}catch(e){$('#status').textContent=e.message}};
$('#generate').onclick=async()=>{if(!selected)return;$('#generate').disabled=true;$('#status').textContent='正在上传并生成，请保留此页面…';try{const r=await fetch('/api/mesh/generate',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:selected});const s=await r.json();if(!r.ok)throw Error(s.error)}catch(e){$('#status').textContent=e.message;$('#generate').disabled=false}};
let wasRunning=false;async function poll(){try{const s=await fetch('/api/mesh/status').then(r=>r.json());$('#log').textContent=s.log;if(s.running){wasRunning=true;$('#generate').disabled=true;const stages=s.log.match(/STAGE: .*/g);$('#status').textContent=stages?stages.at(-1).replace('STAGE: ','处理中：'):'正在启动 GPU 生成任务…'}else{if(selected)$('#generate').disabled=false;if(s.error)$('#status').textContent=s.error;else if(s.result){if(loaded!==s.result)await loadModel(s.result);$('#status').textContent='生成完成。可以旋转查看背面并下载三维模型。'}wasRunning=false}}catch(e){$('#log').textContent=e.message}setTimeout(poll,2000)}const embedId=new URLSearchParams(location.search).get('embed');if(embedId&&/^[a-zA-Z0-9_]+$/.test(embedId)){document.querySelector('header').style.display='none';document.querySelector('main>section').style.display='none';document.querySelector('main').style.display='block';loadModel('studio_results/'+embedId).catch(e=>$('#meta').textContent=e.message)}else poll();if(!embedId)fetch('mesh_results/sample/mesh.json').then(r=>{if(r.ok&&!loaded)return loadModel('mesh_results/sample')}).catch(()=>{});
</script></html>
